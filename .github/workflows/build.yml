name: Build Frappe LMS image
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get Railway template
        run: git clone --depth 1 https://github.com/harshtandiya/frappe_railway

      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frappe-lms:v16" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frappe_railway/frappe
          build-args: |
            FRAPPE_APPS=https://github.com/frappe/payments@version-16,https://github.com/frappe/lms@main
          push: true
          tags: ${{ steps.img.outputs.name }}
